[package]
name = "rust_lib_localscreen"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flutter_rust_bridge = "=2.13.0"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
if-addrs = "0.15"
log = "0.4"
mdns-sd = "0.21"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
spake2 = "0.4"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
