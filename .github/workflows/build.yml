name: Build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Rust format, lint and tests
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux
    # The oldest supported runner, so the package installs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            dpkg-dev fakeroot librsvg2-bin
      - run: flutter build linux --release
      - name: Package (.deb)
        run: packaging/linux/build_deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: localscreen-linux-deb
          path: dist/*.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Debug-signed so it installs without a release keystore.
      - run: flutter build apk --release
      - name: Package (.apk)
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LocalScreen-$version-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: localscreen-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - name: Package (installer)
        shell: bash
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          # Flutter does not bundle the Visual C++ runtime the app links against.
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "$SYSTEMROOT/System32/$dll" build/windows/x64/runner/Release/
          done
          command -v iscc >/dev/null || choco install innosetup --no-progress -y
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          iscc "//DAppVersion=$version" 'packaging\windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: localscreen-windows-x64
          path: build/LocalScreen-*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      - name: Package (.dmg)
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p stage dist
          cp -R build/macos/Build/Products/Release/localscreen.app stage/LocalScreen.app
          ln -s /Applications stage/Applications
          hdiutil create -volname LocalScreen -srcfolder stage -ov -format UDZO \
            "dist/LocalScreen-$version-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: localscreen-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Release
    # Attaches the installers to the release of a pushed version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, linux, android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "LocalScreen ${TAG#v}" --generate-notes
          gh release upload "$TAG" --clobber *
